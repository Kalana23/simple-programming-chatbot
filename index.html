<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnio Chatbot</title>
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    body::before, body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
    }
    body::before {
      width: 300px;
      height: 300px;
      background: #4f46e5;
      top: -50px;
      left: -50px;
      opacity: 0.5;
    }
    body::after {
      width: 250px;
      height: 250px;
      background: #ec4899;
      bottom: -50px;
      right: -50px;
      opacity: 0.5;
    }
    .chat-container {
      width: 90%;
      max-width: 400px;
      height: 540px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1;
    }
    header {
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .chat-box {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: transparent;
      scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar {
      width: 6px;
    }
    .chat-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }
    .message {
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 12px;
      max-width: 78%;
      line-height: 1.4;
      white-space: pre-line;
      animation: fadeInMsg 0.3s ease-out forwards;
      opacity: 0;
      transform: translateY(10px);
    }
    @keyframes fadeInMsg {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .user {
      background: rgba(79, 70, 229, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }
    .bot {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }
    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
    }
    .input-area input {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: border 0.2s;
    }
    .input-area input::placeholder {
      color: #94a3b8;
    }
    .input-area input:focus {
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .input-area button {
      background: rgba(79, 70, 229, 0.8);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      margin-left: 6px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .input-area button:hover {
        background: rgba(79, 70, 229, 1);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-container">
    <header>💻 Learnio Chatbot</header>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask me something...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const API_KEY = "YOUR_API_KEY_HERE";
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    async function fetchAIResponse(userText) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
      const payload = {
        contents: [{
          parts: [{ text: userText }]
        }]
      };

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();

        if (data.candidates && data.candidates.length > 0 && data.candidates[0].content && data.candidates[0].content.parts.length > 0) {
           return data.candidates[0].content.parts[0].text;
        } else {
           return "I could not process the response. Please try again.";
        }
      } catch (error) {
        console.error("Error fetching AI response:", error);
        return "Sorry, I am having trouble connecting to the AI right now.";
      }
    }

    function sanitizeHTML(str) {
      const temp = document.createElement('div');
      temp.textContent = str;
      return temp.innerHTML;
    }

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      msg.innerHTML = sanitizeHTML(text);
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }


    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage(text, "user");
      userInput.value = "";

      const reply = await fetchAIResponse(text);
      addMessage(reply, "bot");
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    addMessage("👋 Hello! I'm the Programming Chatbot. You can ask me questions about programming! 😄", "bot");
  </script>
</body>
</html>
